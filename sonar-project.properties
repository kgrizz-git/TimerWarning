sonar.projectKey=timer-warning
sonar.projectName=TimerWarning

# Local SonarQube Community Build only. SonarQube Cloud automatic analysis
# ignores this file. The cloud project key is kgrizz-git_TimerWarning.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.host.url=http://localhost:9000
sonar.token=${env.SONAR_TOKEN}

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.sources=lib,scripts,configure.sh,install.sh,manage.sh,manual-uninstall-guide.sh,sleep-warning.sh,status.sh,uninstall.sh
sonar.tests=tests
sonar.test.inclusions=tests/**/*.sh,tests/**/*.py

# This repo is shell and Python. Do not pick up stray C-family files.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.exclusions=\
  **/__pycache__/**,\
  .venv/**,\
  venv/**,\
  tmp/**,\
  backups/**,\
  .scannerwork/**,\
  .git/**,\
  .env,\
  .env.*
