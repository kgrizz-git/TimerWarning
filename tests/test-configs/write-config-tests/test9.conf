# Sleep Warning Configuration
# Format: DAY=START_HOUR-END_HOUR
# Hours are in 24-hour format (0-23)
# Multiple ranges can be specified per day (comma-separated)
# Leave a day empty or omit it to have no restrictions for that day
#
# CHECK_INTERVAL: How often to check for restricted hours (in minutes)
# Default: 10 minutes
# Minimum: 1 minute
# Maximum: 60 minutes
CHECK_INTERVAL=10
#
# POPUP_SIZE: Size of warning popup (small, medium, large, or custom WIDTHxHEIGHT)
# Default: medium
POPUP_SIZE=medium
# POPUP_SIZE has been restricted to small/medium only because restrictions exceed 23 hours/day.
# This prevents overly intrusive popups when user has very limited unrestricted time.
#
# POPUP_POSITION: Position of warning popup on screen
# Default: center
POPUP_POSITION=center
#
# POPUP_MIN_DISPLAY_TIME: Minimum time popup must be visible before it can be closed (in seconds)
# Default: 30 seconds
POPUP_MIN_DISPLAY_TIME=30
#
# POPUP_IMMOVABLE: Prevent popup window from being moved during minimum display time
# Default: true
POPUP_IMMOVABLE=true
#
# CONFIGURE_BLOCK_ENABLED: Prevent configure.sh and manage.sh from running during restricted hours
# Default: false (opt-in feature)
# When enabled, configuration and management scripts are blocked during restricted hours
# to prevent users from circumventing restrictions by changing settings
# This is Enhancement #19 (Prevent configure.sh and manage.sh Execution)
CONFIGURE_BLOCK_ENABLED=false
# CONFIGURE_BLOCK_ENABLED has been disabled because restrictions exceed 23 hours/day.
# This prevents accidental lockout when user has very limited unrestricted time.
#
# This file was generated by the configuration wizard on Tue Jan 20 02:17:20 AM EST 2026

SUNDAY=0-5
MONDAY=0-5
TUESDAY=0-5
WEDNESDAY=0-5
THURSDAY=0-5
FRIDAY=0-5
SATURDAY=1-5
