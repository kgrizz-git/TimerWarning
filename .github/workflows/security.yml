# Security static analysis — ShellCheck, Gitleaks, Semgrep
# Does not modify user config or run install/configure against live HOME.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          echo "/usr/local/bin" >> "${GITHUB_PATH}"
          python3 -m pip install --user semgrep
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: ShellCheck, Gitleaks, Semgrep
        run: ./scripts/run-security-scan.sh --ci

      - name: Tier-A safety unit tests
        run: ./scripts/run-security-scan.sh --ci --with-tests
