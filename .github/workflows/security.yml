# Security static analysis + Tier-A tests (agent-agnostic PR gate)
# Does not modify user config or run install/configure against live HOME.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          GL_VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//')
          if [ -z "${GL_VERSION}" ] || [ "${GL_VERSION}" = "null" ]; then
            GL_VERSION="8.24.2"
          fi
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin
          python3 -m pip install --user semgrep
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: ShellCheck, Gitleaks, Semgrep
        run: ./scripts/run-security-scan.sh --ci

      - name: Python line coverage
        env:
          COVERAGE_FLOOR: display
        run: |
          sudo apt-get install -y -qq python3-tk xvfb
          python3 -m pip install --user --only-binary :all: 'coverage==7.15.0'
          xvfb-run -a ./scripts/check-python-coverage.sh

      - name: Ruff, shell complexity, file sizes, basedpyright
        run: |
          # Keep these pins equal to requirements-dev.txt.
          python3 -m pip install --user --only-binary :all: 'ruff==0.16.8' 'basedpyright==1.29.4'
          ./scripts/check-quality.sh

      - name: Shell line coverage
        run: ./scripts/check-shell-coverage.sh

      - name: Doc drift (warn-only)
        run: ./scripts/check-doc-drift.sh

  tier-a-tests:
    name: Tier-A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Tier-A tests (headless)
        env:
          CI: true
          CI_HEADLESS: 1
        run: ./scripts/run-tests.sh --tier a

      - name: Shell line coverage (macOS floor)
        if: runner.os == 'macOS'
        run: ./scripts/check-shell-coverage.sh
