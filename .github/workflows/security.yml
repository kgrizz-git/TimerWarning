# Security static analysis + Tier-A tests (agent-agnostic PR gate)
# Does not modify user config or run install/configure against live HOME.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          GL_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin
          python3 -m pip install --user semgrep
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: ShellCheck, Gitleaks, Semgrep
        run: ./scripts/run-security-scan.sh --ci

      - name: Doc drift (warn-only)
        run: ./scripts/check-doc-drift.sh

  tier-a-tests:
    name: Tier-A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tier-A tests (headless)
        env:
          CI: true
          CI_HEADLESS: 1
        run: ./scripts/run-tests.sh --tier a
