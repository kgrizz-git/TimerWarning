# Sleep Warning Configuration
# Format: DAY=START_HOUR-END_HOUR
# Hours are in 24-hour format (0-23)
# Multiple ranges can be specified per day (comma-separated)
# Leave a day empty or omit it to have no restrictions for that day
#
# CHECK_INTERVAL: How often to check for restricted hours (in minutes)
# Default: 10 minutes
# Minimum: 1 minute
# Maximum: 60 minutes
CHECK_INTERVAL=10
#
# POPUP_SIZE: Size of warning popup (small, medium, large, or custom WIDTHxHEIGHT)
# Default: medium
# Options: small (300x150), medium (400x200), large (500x250), or custom like "450x220"
POPUP_SIZE=medium
#
# POPUP_POSITION: Position of warning popup on screen
# Default: center
# Options: center, top-left, top-right, bottom-left, bottom-right, top-center, bottom-center
# Note: Position control requires yad or window manager tools (wmctrl/xdotool)
POPUP_POSITION=center
#
# POPUP_MIN_DISPLAY_TIME: Minimum time popup must be visible before it can be closed (in seconds)
# Default: 30 seconds
# Minimum: 0 seconds (disabled)
# Maximum: 300 seconds (5 minutes)
# Note: Requires wmctrl or xdotool for full functionality (X11 only, not Wayland)
POPUP_MIN_DISPLAY_TIME=30
#
# Default configuration:
# - Weekdays (Monday-Friday): Midnight (00:00) to 6:00 AM
# - Weekends (Saturday-Sunday): 1:00 AM to 6:00 AM

SUNDAY=1-5
MONDAY=0-5
TUESDAY=0-5
WEDNESDAY=0-5
THURSDAY=0-5
FRIDAY=0-5
SATURDAY=1-5
