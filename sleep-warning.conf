# Sleep Warning Configuration
#
# IMPORTANT: Both installation and configuration steps should be completed:
#   1. Install (./install.sh): Sets up the system and starts the timer
#   2. Configure (sleep-warning-configure): Customizes restricted hours
#
# Recommended order: Install first, then configure. However, both scripts
# can be run in any order - if you configure first, your settings will be
# preserved during installation.
#
# Format: DAY=START_HOUR-END_HOUR
# Hours are in 24-hour format (0-23)
#
# Time Range Options:
# • Single range: 0-5 (midnight to 4:59 AM)
# • Multiple ranges: 0-5,22-23 (midnight to 4:59 AM AND 10 PM to 11:59 PM)
# • Overnight range: 23-6 (11 PM to 5:59 AM, spans midnight)
#
# Examples:
#   MONDAY=0-5        # Midnight to 4:59 AM
#   TUESDAY=23-6      # 11 PM to 5:59 AM (overnight)
#   WEDNESDAY=0-5,22-23  # Midnight to 4:59 AM AND 10 PM to 11:59 PM
#
# Leave a day empty or omit it to have no restrictions for that day
#
# POPUP_DISPLAY_FREQUENCY: How often to show warning popups (in minutes). Range 1-60. (Enhancement #30)
# Default: 10 minutes
POPUP_DISPLAY_FREQUENCY=10
#
# POPUP_SIZE: Size of warning popup (small, medium, large, or custom WIDTHxHEIGHT)
# Default: medium
# Options: small (400x250), medium (800x500), large (1230x720), or custom like "600x400"
POPUP_SIZE=medium
#
# POPUP_POSITION: Position of warning popup on screen
# Default: center
# Options: center, top-left
# Note: Position control works best with yad dialog tool (preferred) which supports native positioning
POPUP_POSITION=center
#
# POPUP_MIN_DISPLAY_TIME: Minimum time popup must be visible before it can be closed (in seconds)
# Default: 30 seconds
# Minimum: 0 seconds (disabled)
# Maximum: 300 seconds (5 minutes)
# Note: Requires wmctrl or xdotool for full functionality (X11 only, not Wayland)
POPUP_MIN_DISPLAY_TIME=30
#
# POPUP_IMMOVABLE: Prevent popup window from being moved during minimum display time
# Default: true
# Options: true, false
# Note: Uses position monitoring method (checks and restores position if moved)
# Requires wmctrl or xdotool (X11 only, not Wayland)
POPUP_IMMOVABLE=true
#
# POPUP_AUTO_CLOSE: Automatically close popup window 10 seconds after minimum display time completes
# Default: true (enabled by default)
# Options: true, false
# Auto-close happens 10 seconds after minimum display time completes (additional time, not total time)
# If minimum display time is 0, auto-close happens after 10 seconds
# Auto-close time is fixed at 10 seconds (not configurable)
# This is Enhancement #15 (Auto-Close Popup Window)
POPUP_AUTO_CLOSE=true
#
# CONFIGURE_BLOCK_ENABLED: Tighten-only configure.sh and manage.sh during restricted hours
# Default: false (opt-in feature)
# Options: true, 1, yes, false, 0, no
# When enabled, configuration and management scripts stay available but can only
# tighten restrictions during restricted hours (partial lock). They are not a
# full "refuse to run" lock. This is Enhancement #19.
CONFIGURE_BLOCK_ENABLED=false
#
# CONFIG_LOCK_HOURS: Additional hours for blocking configure.sh and manage.sh (separate from restriction hours)
# Format: CONFIG_LOCK_HOURS_DAYNAME=START_HOUR-END_HOUR
# Hours are in 24-hour format (0-23)
# Multiple ranges can be specified per day (comma-separated, e.g., "9-17,20-22")
# Overnight ranges are supported (e.g., "23-6" spans midnight)
# Leave a day empty or omit it to have no lock hours for that day
# When CONFIGURE_BLOCK_ENABLED=true, scripts are blocked during restriction hours OR lock hours (OR logic)
# This is Enhancement #19 Phase 2 (Additional Configurable Lock Hours)
# Examples:
#   CONFIG_LOCK_HOURS_MONDAY=9-17        # Block during work hours (9 AM to 4:59 PM)
#   CONFIG_LOCK_HOURS_TUESDAY=0-5,22-23   # Block during early morning and late evening
#   CONFIG_LOCK_HOURS_WEDNESDAY=23-6      # Block overnight (11 PM to 5:59 AM)
#
# Default configuration:
# - Weekdays (Monday-Friday): Midnight (00:00) to 4:59 AM
# - Weekends (Saturday-Sunday): 1:00 AM to 4:59 AM
#
# UNINSTALL_PROTECTION_MODE: Protection mode for uninstall.sh during restricted hours
# Default: difficult
# Options:
#   none - No protection, uninstall works normally during restricted hours
#   difficult - Difficult uninstall, requires confirmation phrase + 5 arithmetic questions
# When enabled, uninstall.sh requires verification during restricted hours to prevent
# users from circumventing restrictions by uninstalling the system.
# This is Enhancement #26 (Prevent uninstall.sh Execution During Restricted Hours)
# Note: Total block mode may be considered as future phase
#UNINSTALL_PROTECTION_MODE=difficult
#
# DIALOG_TOOL: Dialog tool selection for popup windows
# Default: auto (uses automatic priority: YAD → Zenity → KDialog)
# Options:
#   auto - Automatic selection (recommended, uses priority system)
#   zenity - Force use of zenity (if installed)
#   yad - Force use of yad (if installed)
#   kdialog - Force use of kdialog (if installed)
# If selected tool is not installed, system falls back to automatic selection
# This is Enhancement #25 (User-Selectable Dialog Tool)
#DIALOG_TOOL=auto
#
# UNINSTALL_LOCK_HOURS: Additional hours for difficult uninstall verification (separate from restriction hours and configure.sh lock hours)
# Format: UNINSTALL_LOCK_HOURS_DAYNAME=START_HOUR-END_HOUR
# Hours are in 24-hour format (0-23)
# Multiple ranges can be specified per day (comma-separated, e.g., "9-17,20-22")
# Overnight ranges are supported (e.g., "23-6" spans midnight)
# Leave a day empty or omit it to have no uninstall lock hours for that day
# When UNINSTALL_PROTECTION_MODE=difficult, difficult uninstall verification applies during restriction hours OR uninstall lock hours (OR logic)
# This is Enhancement #26 Phase 2 (Additional Uninstall Lock Hours)
# WARNING: Additional uninstall lock hours increase the risk of preventing legitimate uninstall needs
# Examples:
#   UNINSTALL_LOCK_HOURS_MONDAY=9-17        # Require verification during work hours (9 AM to 4:59 PM)
#   UNINSTALL_LOCK_HOURS_TUESDAY=0-5,22-23   # Require verification during early morning and late evening
#   UNINSTALL_LOCK_HOURS_WEDNESDAY=23-6      # Require verification overnight (11 PM to 5:59 AM)

SUNDAY=1-5
MONDAY=0-5
TUESDAY=0-5
WEDNESDAY=0-5
THURSDAY=0-5
FRIDAY=0-5
SATURDAY=1-5
